<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Daily News Brief - Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #ececea; --fg: #24272c; --muted: #6c7075; --accent: #9c7016;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #2c2e31; --fg: #eef0f2; --muted: #acb0b7; --accent: #e3b34e; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 2rem;
    text-align: center;
  }
  .wrap { max-width: 30rem; }
  .eyebrow {
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin: 0 0 0.9rem;
  }
  h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: -0.02em; margin: 0 0 0.8rem; }
  p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 0 0 1.6rem; }
  a.back { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
  a.back:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">AI Daily News Brief</p>
    <h1>Sign-up coming soon</h1>
    <p>A public way to subscribe to the daily brief is on the way. Check back shortly.</p>
    <a class="back" href="/">&larr; Back to davidgoodloe</a>
  </div>
</body>
</html>
